<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  ARQUIVO: index.html — página HTML “casca” do site
  ═══════════════════════════════════════════════════════════════════════════
  O React desenha tudo DENTRO da <div id="root">. O Vite injeta o script em /src/main.tsx.

  O que você pode mudar aqui (como iniciante):
  · <title> — texto da aba do navegador
  · meta name="description" — descrição em buscadores / preview de link
  · link rel="icon" — favicon (ícone da aba). Aponta para /logo.svg na pasta public/
    → Para usar PNG: coloque logo.png em public/ e troque href="/logo.png"
  · meta og:image — imagem quando alguém compartilha o link (use URL absoluta em produção)
  ═══════════════════════════════════════════════════════════════════════════
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0410" />
    <title>Cyber World — Discord para Devs, Hackers e CyberSec</title>
    <meta name="description" content="Comunidade Discord cyberpunk para desenvolvedores, hackers éticos e profissionais de cybersecurity. Entre no Cyber World." />
    <meta name="author" content="Cyber World" />
    <link rel="canonical" href="/" />

    <!-- Ícone da aba + atalho na tela inicial do celular (usa o mesmo arquivo que o menu do site) -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <meta property="og:title" content="Cyber World — Discord para Devs e CyberSec" />
    <meta property="og:description" content="Servidor Discord cyberpunk para devs, hackers e profissionais de segurança da informação." />
    <meta property="og:type" content="website" />
    <!-- Troque por URL absoluta em produção, ex: https://seudominio.com/og.jpg -->
    <meta property="og:image" content="/og.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
